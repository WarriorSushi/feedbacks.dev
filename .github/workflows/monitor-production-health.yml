name: Monitor Production Health

on:
  schedule:
    - cron: '7-59/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-production-health
  cancel-in-progress: true

jobs:
  health:
    name: Check production health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check cron secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured for this repository."
            exit 1
          fi

      - name: Check production health
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://app.feedbacks.dev/api/internal/health
