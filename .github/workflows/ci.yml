name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [dependency-audit, typecheck, lint, unit]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NEXT_PUBLIC_APP_ORIGIN: https://feedbacks.dev
      INTEGRATION_SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm widget:check-size
      - run: pnpm dashboard:check-budgets

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_ORIGIN: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      E2E_AUTH_BYPASS_SECRET: ${{ secrets.E2E_AUTH_BYPASS_SECRET }}
      E2E_ENVIRONMENT: "true"
      E2E_SUPABASE_PROJECT_REF: ${{ secrets.E2E_SUPABASE_PROJECT_REF }}
      E2E_EXPECTED_HOSTNAME: 127.0.0.1
      E2E_TEST_NAMESPACE: e2e:github-actions
      PLAYWRIGHT_TEST_EMAIL: playwright@feedbacks.dev
      PLAYWRIGHT_TEST_PASSWORD: Playwright!12345
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Detect isolated E2E backend
        id: isolated-e2e
        shell: bash
        run: |
          if [[ -n "$NEXT_PUBLIC_SUPABASE_URL" \
            && -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            && -n "$SUPABASE_SERVICE_ROLE_KEY" \
            && -n "$E2E_AUTH_BYPASS_SECRET" \
            && -n "$E2E_SUPABASE_PROJECT_REF" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Playwright E2E not executed"
              echo
              echo "The suite requires a separately billed, isolated Supabase backend."
              echo "It will never fall back to the production project."
              echo "Configure the E2E secrets after the branch cost is explicitly approved."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.isolated-e2e.outputs.available == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.isolated-e2e.outputs.available == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.isolated-e2e.outputs.available == 'true'
        run: node scripts/check-e2e-env.mjs
      - if: steps.isolated-e2e.outputs.available == 'true'
        run: pnpm exec playwright test packages/dashboard/tests/e2e --project=chromium
